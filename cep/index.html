<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>AI 换鞋 Demo CEP</title><link rel="stylesheet" href="styles.css"></head>
<body><main><header><h1>AI 换鞋 Demo</h1><span>PS 2024</span></header><p id="doc">未读取文档</p>
<section><h2>数据</h2><input id="excel" type="file" accept=".xlsx,.xls,.csv"><p id="fileName">请选择 Excel</p><label>新货号（替换当前模板款）<select id="targetSku"><option value="">请先读取 Excel</option></select></label></section>
<section><h2>素材库</h2><label>目录<input id="libraryPath" type="text" value="/Volumes/UED资产库/UED资产库.library"></label><button id="library">读取素材库</button><button id="apiTest">测试 API</button></section>
<details><summary>登记离线素材对应关系</summary><label>Excel 款色<select id="materialProduct"></select></label><label>透明鞋素材<input id="cutout" type="file" accept=".png"></label><label>多角度参考图<input id="referenceFiles" type="file" accept=".png,.jpg,.jpeg" multiple></label><button id="bindMaterial">登记款色素材</button></details>
<section><h2>任务</h2><button id="scan">扫描标记</button><button id="working">创建工作副本</button><button id="diagnostics">导出扫描诊断</button><button id="batch">开始批量换鞋</button><p id="count">0 个任务</p><p>自动进入智能对象；有明确鞋部蒙版时复用，没有时用本地 DINO+SAM 自动检测鞋部并分割；检测不到时跳过并记录结构诊断。紫色双人款跳过。全部先导出，AI 最多 4 并发，最后串行回写；无保护选区仅保留预览。</p><div id="tasks"></div></section>
<section><button id="save">另存 PSB 副本</button></section>
<footer id="message">CEP 面板已加载</footer></main>
<script src="CSInterface.js"></script><script src="panel.js"></script></body></html>
